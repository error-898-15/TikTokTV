# Gradle JVM: more heap + deeper stack (fallback if Kotlin compiles in-process)
org.gradle.jvmargs=-Xmx3g -Xss256m -Dfile.encoding=UTF-8
# Kotlin compiler daemon: ScraperVideoRepository.fetchUserProfileInternal is a very large
# suspend function; the coroutine transformer recurses deeply on it and overflowed the
# default thread stack (StackOverflowError in checkForSuspensionPointInsideMonitor).
kotlin.daemon.jvmargs=-Xmx3g -Xss256m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
