name: Android TV Debug APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Gradle wrapper is ready
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Extract error summary
        if: always()
        run: |
          touch build.log
          {
            echo "===== Kotlin/Java compile errors (e: / error:) ====="
            grep -nE "^e: |^e:|error:" build.log || echo "(none found)"
            echo
            echo "===== Gradle failure details (What went wrong) ====="
            grep -n -A 12 "What went wrong" build.log || echo "(none found)"
            echo
            echo "===== Failed tasks ====="
            grep -nE "FAILED" build.log || echo "(none found)"
          } > build-errors.txt

      - name: Upload build logs (always, even if build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            build-errors.txt
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TikTokTV-debug.apk
          gh release create "build-${{ github.run_number }}" TikTokTV-debug.apk \
            --title "TikTokTV debug build #${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}" \
            --target "${{ github.sha }}" \
            --latest
